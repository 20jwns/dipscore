spring:
  application:
    name: dipscore-backend

  datasource:
    # 로컬 개발 DB: 루트의 docker-compose.yml (timescale/timescaledb)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dipscore}
    username: ${DB_USERNAME:dipscore}
    password: ${DB_PASSWORD:dipscore}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: dipscore-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.dipscore: DEBUG

# ─────────────────────────────────────────────
# 토스증권 오픈API 연동
#   실제 값은 커밋하지 않는다. backend/.env (git 제외) 또는 배포 환경변수로 주입.
#   필요한 키 목록은 backend/.env.example 참고.
#   base-url / *-path 기본값은 공개 스펙(https://openapi.tossinvest.com/openapi-docs/latest/openapi.json,
#   2026-09 확인) 기준. 스펙이 바뀌면 이 값들만 갱신하면 되고 코드 변경은 불필요.
# ─────────────────────────────────────────────
toss:
  api:
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
    base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
    connect-timeout: ${TOSS_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOSS_API_READ_TIMEOUT:5s}
    auth:
      base-url: ${TOSS_AUTH_BASE_URL:https://openapi.tossinvest.com}
      token-path: ${TOSS_AUTH_TOKEN_PATH:/oauth2/token}
      grant-type: ${TOSS_AUTH_GRANT_TYPE:client_credentials}
      scope: ${TOSS_AUTH_SCOPE:}
      # 만료 이 시간 전이면 미리 갱신 (실제 expires_in=86400 기준)
      refresh-skew: ${TOSS_AUTH_REFRESH_SKEW:60s}
    quote:
      # GET {price-path}?symbols=005930,AAPL (comma-separated, 최대 200개)
      price-path: ${TOSS_QUOTE_PRICE_PATH:/api/v1/prices}

# ─────────────────────────────────────────────
# DART 전자공시 오픈API (opendart.fss.or.kr)
#   인증키는 커밋 금지. backend/.env 의 DART_API_KEY 로 주입 (opendart 에서 발급, 40자리).
#   DART 는 OAuth 가 아니라 쿼리 파라미터 crtfc_key 로 인증한다.
#   base-url / *-path 는 opendart 공개 스펙 기준 (2026-09 확인).
# ─────────────────────────────────────────────
dart:
  api:
    api-key: ${DART_API_KEY:}
    base-url: ${DART_API_BASE_URL:https://opendart.fss.or.kr}
    connect-timeout: ${DART_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${DART_API_READ_TIMEOUT:10s}
    company-path: ${DART_API_COMPANY_PATH:/api/company.json}
    financials-path: ${DART_API_FINANCIALS_PATH:/api/fnlttSinglAcntAll.json}
    corp-code-path: ${DART_API_CORP_CODE_PATH:/api/corpCode.xml}
    stock-total-count-path: ${DART_API_STOCK_TOTAL_PATH:/api/stockTotqySttus.json}

# ─────────────────────────────────────────────
# 한국은행 ECOS 오픈API (ecos.bok.or.kr/api)
#   인증키는 커밋 금지. backend/.env 의 ECOS_API_KEY 로 주입. 인증키는 URL 경로 세그먼트로 전달된다.
#   통계표/항목 코드는 2026-09 ECOS 실데이터로 검증한 값 (StatisticSearch).
# ─────────────────────────────────────────────
ecos:
  api:
    api-key: ${ECOS_API_KEY:}
    base-url: ${ECOS_API_BASE_URL:https://ecos.bok.or.kr}
    language: ${ECOS_API_LANGUAGE:kr}
    statistic-search-path: ${ECOS_API_STAT_SEARCH_PATH:/api/StatisticSearch}
    connect-timeout: ${ECOS_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${ECOS_API_READ_TIMEOUT:10s}
    # 정식 인증키는 최대 100000, sample 키로 시험할 땐 10 이하로.
    max-rows: ${ECOS_API_MAX_ROWS:100}
    indicators:
      # 기준금리: 722Y001 / 0101000 / 월 (연%)
      base-rate:     { stat-code: "722Y001", item-code: "0101000", cycle: "M" }
      # 원/달러 매매기준율: 731Y001 / 0000001 / 일 (원)
      exchange-rate: { stat-code: "731Y001", item-code: "0000001", cycle: "D" }
      # 소비자물가지수 총지수: 901Y009 / 0 / 월 (2020=100)
      cpi:           { stat-code: "901Y009", item-code: "0",       cycle: "M" }

# ─────────────────────────────────────────────
# 시세 적재 스케줄러 (TossQuoteClient → price_history 하이퍼테이블)
#   1차: 삼성전자 1종목으로 스케줄링 파이프라인 동작 검증.
#   enabled=false 로 두면 스케줄러 빈이 아예 생성되지 않는다.
# ─────────────────────────────────────────────
dipscore:
  ingestion:
    price:
      enabled: ${PRICE_INGESTION_ENABLED:true}
      symbols: ${PRICE_INGESTION_SYMBOLS:005930}
      interval-ms: ${PRICE_INGESTION_INTERVAL_MS:60000}
      initial-delay-ms: ${PRICE_INGESTION_INITIAL_DELAY_MS:10000}

# ─────────────────────────────────────────────
# 매력도 지수 "기본점수" 엔진 (기획서 4장)
#   가중치는 하드코딩 금지 → 여기서 주입. 현재는 전문가 초안, 4단계 방법론(4-4)으로 확정 예정.
#   합이 1이 아니어도 됨 (엔진이 정규화). 가중치 0 이면 요인 제외.
#   enabled=false 면 DB 의존 빈(BaseScoreService/컨트롤러/적재서비스) 미생성.
# ─────────────────────────────────────────────
attractiveness:
  enabled: ${ATTRACTIVENESS_ENABLED:true}
  engine-version: base-v1
  target-fiscal-year: ${ATTRACTIVENESS_FISCAL_YEAR:0}   # 0 = 자동(최신 fiscal_year DESC), >0 = 해당 연도 고정
  fs-div: CFS
  macro-zscore-window: 24
  weights:
    per: 0.20
    pbr: 0.15
    debt-to-equity: 0.15
    roe: 0.20
    revenue-growth: 0.15
    base-rate: 0.075
    usd-krw: 0.075
  # 주간 재무제표 적재 스케줄러 (DART fnlttSinglAcntAll + stockTotqySttus → financial_snapshot).
  #   대상 종목은 daily-batch.symbols 재사용. 사업보고서(11011) 우선, 없으면 분기보고서 폴백.
  #   이미 있는 회계연도는 skip. attractiveness.enabled 와 이 enabled 가 모두 true 여야 빈 생성.
  #   수동 트리거: POST /api/admin/financial-snapshot-sync
  financial-sync:
    enabled: ${FINANCIAL_SNAPSHOT_SYNC_ENABLED:true}
    cron: ${FINANCIAL_SNAPSHOT_SYNC_CRON:0 0 3 * * MON}   # Asia/Seoul, 매주 월 03:00
    target-fiscal-year: ${FINANCIAL_SNAPSHOT_SYNC_FISCAL_YEAR:0}   # 0 = 자동(작년)
    request-delay-ms: ${FINANCIAL_SNAPSHOT_SYNC_DELAY_MS:300}
  # 거시지표(ECOS) 자동 갱신 스케줄러 (EcosStatisticClient.latestX → macro_indicator, 이미 있는 ts 는 skip).
  #   환율(USD_KRW) 매일 06:00 / 기준금리·CPI 월 1일 06:00 (Asia/Seoul).
  #   attractiveness.enabled 와 이 enabled 가 모두 true 여야 빈 생성. 수동 트리거: POST /api/admin/macro-sync
  macro-sync:
    enabled: ${MACRO_SYNC_ENABLED:true}
    exchange-rate-cron: ${MACRO_SYNC_FX_CRON:0 0 6 * * *}     # 매일 06:00
    monthly-cron: ${MACRO_SYNC_MONTHLY_CRON:0 0 6 1 * *}      # 매월 1일 06:00 — 기준금리·CPI

# ─────────────────────────────────────────────
# 과거 시세 백필 (토스 일봉 캔들 GET /api/v1/candles)
#   enabled=true 여도 자동 실행 안 함 — POST /api/admin/price-backfill 로만 수동 트리거.
#   스케줄러(dipscore.ingestion.price)와 별개.
# ─────────────────────────────────────────────
backfill:
  prices:
    enabled: ${BACKFILL_PRICES_ENABLED:true}
    symbols: ${BACKFILL_PRICES_SYMBOLS:005930,000660,042700}
    days: ${BACKFILL_PRICES_DAYS:365}
    request-delay-ms: ${BACKFILL_PRICES_DELAY_MS:300}

# ─────────────────────────────────────────────
# 일별 배치. daily-batch.symbols 는 모든 일별 배치가 공유하는 대상 종목.
#   daily-candle: 장 마감 후 최신 일봉 1건을 price_history 에 append. 수동: POST /api/admin/daily-candle-sync
#   scoring: 장 시작 전 매력도 → 저점진입 스코어를 순서대로 계산. 수동: POST /api/admin/daily-scoring
#           (attractiveness.enabled + entry-score.enabled + 이 enabled 가 모두 true 여야 빈 생성)
# ─────────────────────────────────────────────
daily-batch:
  symbols: ${DAILY_BATCH_SYMBOLS:005930,000660,042700}
  daily-candle:
    enabled: ${DAILY_CANDLE_SYNC_ENABLED:true}
    cron: ${DAILY_CANDLE_SYNC_CRON:0 0 16 * * MON-FRI}   # Asia/Seoul, 장 마감(15:30) 후
  scoring:
    enabled: ${DAILY_SCORING_ENABLED:true}
    cron: ${DAILY_SCORING_CRON:0 30 8 * * MON-FRI}       # Asia/Seoul, 평일 08:30 (다른 배치 종료 후, 장 시작 전)

# ─────────────────────────────────────────────
# 저점 진입 스코어 엔진 (기획서 5장)
#   저점 진입 스코어 = (반등신호 × A) + (기술적지표 × B) + (매력도지수 × C)
#   가중치 A/B/C 와 지표 파라미터는 하드코딩 금지 → 여기서 주입 (초안, 4단계 방법론으로 확정 예정).
#   enabled=false 면 DB 의존 빈(EntryScoreService/컨트롤러) 미생성.
# ─────────────────────────────────────────────
entry-score:
  enabled: ${ENTRY_SCORE_ENABLED:true}
  engine-version: entry-v1
  weights:
    rebound-signal: 0.3          # A
    technical-indicator: 0.3     # B
    attractiveness: 0.4          # C
  atr-period: 14
  rsi-period: 14
  rsi-oversold: 30
  bollinger-period: 20
  bollinger-k: 2.0
  recent-window: 10             # "최근 N봉 안에 과매도/하단터치" 판정 창
  rebound-lookback: 20          # 반등신호 기준 고점 계산 창
  rebound-band-low-multiple: 0.5   # <0.5×ATR: 램프업
  rebound-band-high-multiple: 1.5  # 0.5~1.5×ATR: plateau(최고점)
  rebound-band-far-multiple: 3.0   # 1.5~3.0×ATR: 램프다운, ≥3.0: 0
  attractiveness-min-base-score: 60   # 1차 필터 (미통과 → entry_score=0)
  entry-threshold: 70                 # 진입 임계값 (참고/로그용, 백테스트로 조정)

# ─────────────────────────────────────────────
# 매매 신호 판정 (기획서 7). 매수(7-1) + 매도(7-2) 룰의 임계값.
#   임계값은 entry-score.* 와 겹치는 것도 있으나 매매 룰 고유 튜닝 대상이라 분리 (기획서 7-3).
#   enabled=false 면 DB 의존 빈(TradingSignalService/컨트롤러) 미생성.
# ─────────────────────────────────────────────
signal:
  enabled: ${SIGNAL_ENABLED:true}
  entry-threshold: 70          # 저점진입스코어 ≥
  min-base-score: 60           # 매력도 기본점수 ≥
  event-coefficient-min: 0.9   # 이벤트조정계수 ≥ (음수 이벤트 없음). 현재 조정계수는 항상 1.0
  target-profit-rate: 0.025    # 매도: 목표수익률 (기획서 +2~3% 구간, 백테스트로 조정할 단일 운용값)
  stop-loss-atr-multiple: 1.25 # 매도: 손절 ATR 배수 (기획서 1~1.5배 구간)
  force-close-time: "15:20"    # 매도: 보유시간 초과 강제청산 시각 (HH:mm, Asia/Seoul)

# ─────────────────────────────────────────────
# 가상 계좌 / 포지션 (기획서 7). 매수 신호(BUY) 발생 시 MockOrderExecutor 로 가상 체결한다
#   (실제 주문 API 호출 없음 — 1차 범위는 직접/AI 모의투자까지).
#   enabled=false 면 DB 의존 빈(Account/BuyExecution/SellExecution 서비스·MockOrderExecutor·컨트롤러) 미생성.
#   account.enabled 와 signal.enabled 가 모두 true 여야 매수/매도 체결 관련 빈이 뜬다.
# ─────────────────────────────────────────────
account:
  enabled: ${ACCOUNT_ENABLED:true}
  initial-capital: ${ACCOUNT_INITIAL_CAPITAL:10000000}         # POST /api/account/init 기본 초기자금 (원)
  min-initial-capital: ${ACCOUNT_MIN_INITIAL_CAPITAL:100000}   # 계좌 개설 최소 초기자금 — 미달이면 거부
  min-buy-unit: ${ACCOUNT_MIN_BUY_UNIT:100000}                 # 최소매수단위 — 보유현금 > 이 값 이어야 매수신호 조건 충족
  # 변동성 기반 사이징: 수량 = (잔고 × risk-per-trade-pct) / (매수가 - 손절가), 손절가는 entry_atr × signal.stop-loss-atr-multiple
  risk-per-trade-pct: ${ACCOUNT_RISK_PER_TRADE_PCT:0.01}       # 거래당 리스크 허용 비율 (잔고 대비, 기본 1%)
  currency: KRW

# ─────────────────────────────────────────────
# 종목 마스터 대량 채우기 (DART 고유번호 corpCode.xml)
#   scheduled=true 면 매일 cron 에 InstrumentSyncJob 이 전체 동기화 (15분+). 언제든 POST /api/admin/instrument-sync 수동 트리거.
#   상장 종목(stockCode 있음)만, symbol 기준 upsert (name·corp_code·last_seen_at 만 갱신, sector/industry 유지).
#   DART 목록에서 사라진 활성 KR_STOCK 은 유예일 경과 후 active=false (상장폐지 감지).
# ─────────────────────────────────────────────
instrument-sync:
  enabled: ${INSTRUMENT_SYNC_ENABLED:true}
  scheduled: ${INSTRUMENT_SYNC_SCHEDULED:true}
  cron: ${INSTRUMENT_SYNC_CRON:0 0 4 * * *}   # Asia/Seoul, 매일 04:00 (재무:월03시 / 거시:06시 배치와 겹치지 않게)
  chunk-size: ${INSTRUMENT_SYNC_CHUNK_SIZE:500}
  # corp_cls 필터: 각 종목 DART 기업개황 조회로 시장구분 확인 → 코넥스(N) 제외.
  #   3천여 건 개별 호출 → 수십 분 소요 + DART 일일 요청 한도 소모.
  #   빠르게 실행하려면 POST ?filterByCorpCls=false
  filter-by-corp-cls: ${INSTRUMENT_SYNC_FILTER_CORP_CLS:true}
  detect-delistings: ${INSTRUMENT_SYNC_DETECT_DELISTINGS:true}
  stale-days-before-deactivate: ${INSTRUMENT_SYNC_STALE_DAYS:3}   # DART 목록 미확인 N일+ → active=false
  company-lookup-delay-ms: ${INSTRUMENT_SYNC_COMPANY_DELAY_MS:100}
  company-lookup-max-consecutive-failures: ${INSTRUMENT_SYNC_MAX_FAILURES:20}
