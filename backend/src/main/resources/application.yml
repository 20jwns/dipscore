spring:
  application:
    name: dipscore-backend

  datasource:
    # 로컬 개발 DB: 루트의 docker-compose.yml (timescale/timescaledb)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dipscore}
    username: ${DB_USERNAME:dipscore}
    password: ${DB_PASSWORD:dipscore}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: dipscore-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.dipscore: DEBUG

# ─────────────────────────────────────────────
# 토스증권 오픈API 연동
#   실제 값은 커밋하지 않는다. backend/.env (git 제외) 또는 배포 환경변수로 주입.
#   필요한 키 목록은 backend/.env.example 참고.
#   base-url / *-path 기본값은 공개 스펙(https://openapi.tossinvest.com/openapi-docs/latest/openapi.json,
#   2026-09 확인) 기준. 스펙이 바뀌면 이 값들만 갱신하면 되고 코드 변경은 불필요.
# ─────────────────────────────────────────────
toss:
  api:
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
    base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
    connect-timeout: ${TOSS_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOSS_API_READ_TIMEOUT:5s}
    auth:
      base-url: ${TOSS_AUTH_BASE_URL:https://openapi.tossinvest.com}
      token-path: ${TOSS_AUTH_TOKEN_PATH:/oauth2/token}
      grant-type: ${TOSS_AUTH_GRANT_TYPE:client_credentials}
      scope: ${TOSS_AUTH_SCOPE:}
      # 만료 이 시간 전이면 미리 갱신 (실제 expires_in=86400 기준)
      refresh-skew: ${TOSS_AUTH_REFRESH_SKEW:60s}
    quote:
      # GET {price-path}?symbols=005930,AAPL (comma-separated, 최대 200개)
      price-path: ${TOSS_QUOTE_PRICE_PATH:/api/v1/prices}

# ─────────────────────────────────────────────
# DART 전자공시 오픈API (opendart.fss.or.kr)
#   인증키는 커밋 금지. backend/.env 의 DART_API_KEY 로 주입 (opendart 에서 발급, 40자리).
#   DART 는 OAuth 가 아니라 쿼리 파라미터 crtfc_key 로 인증한다.
#   base-url / *-path 는 opendart 공개 스펙 기준 (2026-09 확인).
# ─────────────────────────────────────────────
dart:
  api:
    api-key: ${DART_API_KEY:}
    base-url: ${DART_API_BASE_URL:https://opendart.fss.or.kr}
    connect-timeout: ${DART_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${DART_API_READ_TIMEOUT:10s}
    company-path: ${DART_API_COMPANY_PATH:/api/company.json}
    financials-path: ${DART_API_FINANCIALS_PATH:/api/fnlttSinglAcntAll.json}
    corp-code-path: ${DART_API_CORP_CODE_PATH:/api/corpCode.xml}

# ─────────────────────────────────────────────
# 한국은행 ECOS 오픈API (ecos.bok.or.kr/api)
#   인증키는 커밋 금지. backend/.env 의 ECOS_API_KEY 로 주입. 인증키는 URL 경로 세그먼트로 전달된다.
#   통계표/항목 코드는 2026-09 ECOS 실데이터로 검증한 값 (StatisticSearch).
# ─────────────────────────────────────────────
ecos:
  api:
    api-key: ${ECOS_API_KEY:}
    base-url: ${ECOS_API_BASE_URL:https://ecos.bok.or.kr}
    language: ${ECOS_API_LANGUAGE:kr}
    statistic-search-path: ${ECOS_API_STAT_SEARCH_PATH:/api/StatisticSearch}
    connect-timeout: ${ECOS_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${ECOS_API_READ_TIMEOUT:10s}
    # 정식 인증키는 최대 100000, sample 키로 시험할 땐 10 이하로.
    max-rows: ${ECOS_API_MAX_ROWS:100}
    indicators:
      # 기준금리: 722Y001 / 0101000 / 월 (연%)
      base-rate:     { stat-code: "722Y001", item-code: "0101000", cycle: "M" }
      # 원/달러 매매기준율: 731Y001 / 0000001 / 일 (원)
      exchange-rate: { stat-code: "731Y001", item-code: "0000001", cycle: "D" }
      # 소비자물가지수 총지수: 901Y009 / 0 / 월 (2020=100)
      cpi:           { stat-code: "901Y009", item-code: "0",       cycle: "M" }

# ─────────────────────────────────────────────
# 시세 적재 스케줄러 (TossQuoteClient → price_history 하이퍼테이블)
#   1차: 삼성전자 1종목으로 스케줄링 파이프라인 동작 검증.
#   enabled=false 로 두면 스케줄러 빈이 아예 생성되지 않는다.
# ─────────────────────────────────────────────
dipscore:
  ingestion:
    price:
      enabled: ${PRICE_INGESTION_ENABLED:true}
      symbols: ${PRICE_INGESTION_SYMBOLS:005930}
      interval-ms: ${PRICE_INGESTION_INTERVAL_MS:60000}
      initial-delay-ms: ${PRICE_INGESTION_INITIAL_DELAY_MS:10000}

# ─────────────────────────────────────────────
# 매력도 지수 "기본점수" 엔진 (기획서 4장)
#   가중치는 하드코딩 금지 → 여기서 주입. 현재는 전문가 초안, 4단계 방법론(4-4)으로 확정 예정.
#   합이 1이 아니어도 됨 (엔진이 정규화). 가중치 0 이면 요인 제외.
#   enabled=false 면 DB 의존 빈(BaseScoreService/컨트롤러/적재서비스) 미생성.
# ─────────────────────────────────────────────
attractiveness:
  enabled: ${ATTRACTIVENESS_ENABLED:true}
  engine-version: base-v1
  target-fiscal-year: ${ATTRACTIVENESS_FISCAL_YEAR:2024}
  fs-div: CFS
  macro-zscore-window: 24
  weights:
    per: 0.20
    pbr: 0.15
    debt-to-equity: 0.15
    roe: 0.20
    revenue-growth: 0.15
    base-rate: 0.075
    usd-krw: 0.075

# ─────────────────────────────────────────────
# 과거 시세 백필 (토스 일봉 캔들 GET /api/v1/candles)
#   enabled=true 여도 자동 실행 안 함 — POST /api/admin/price-backfill 로만 수동 트리거.
#   스케줄러(dipscore.ingestion.price)와 별개.
# ─────────────────────────────────────────────
backfill:
  prices:
    enabled: ${BACKFILL_PRICES_ENABLED:true}
    symbols: ${BACKFILL_PRICES_SYMBOLS:005930,000660,042700}
    days: ${BACKFILL_PRICES_DAYS:365}
    request-delay-ms: ${BACKFILL_PRICES_DELAY_MS:300}

# ─────────────────────────────────────────────
# 저점 진입 스코어 엔진 (기획서 5장)
#   저점 진입 스코어 = (반등신호 × A) + (기술적지표 × B) + (매력도지수 × C)
#   가중치 A/B/C 와 지표 파라미터는 하드코딩 금지 → 여기서 주입 (초안, 4단계 방법론으로 확정 예정).
#   enabled=false 면 DB 의존 빈(EntryScoreService/컨트롤러) 미생성.
# ─────────────────────────────────────────────
entry-score:
  enabled: ${ENTRY_SCORE_ENABLED:true}
  engine-version: entry-v1
  weights:
    rebound-signal: 0.3          # A
    technical-indicator: 0.3     # B
    attractiveness: 0.4          # C
  atr-period: 14
  rsi-period: 14
  rsi-oversold: 30
  bollinger-period: 20
  bollinger-k: 2.0
  recent-window: 10             # "최근 N봉 안에 과매도/하단터치" 판정 창
  rebound-lookback: 20          # 반등신호 기준 고점 계산 창
  rebound-band-low-multiple: 0.5   # <0.5×ATR: 램프업
  rebound-band-high-multiple: 1.5  # 0.5~1.5×ATR: plateau(최고점)
  rebound-band-far-multiple: 3.0   # 1.5~3.0×ATR: 램프다운, ≥3.0: 0
  attractiveness-min-base-score: 60   # 1차 필터 (미통과 → entry_score=0)
  entry-threshold: 70                 # 진입 임계값 (참고/로그용, 백테스트로 조정)

# ─────────────────────────────────────────────
# 매매 신호 판정 (기획서 7-1). 현재 "매수 신호" 판정만 — 계좌/포지션 개념이 없어 매도 신호는 TODO.
#   임계값은 entry-score.* 와 같은 값이나 매수 룰 고유 튜닝 대상이라 분리 (기획서 7-3).
#   enabled=false 면 DB 의존 빈(TradingSignalService/컨트롤러) 미생성.
# ─────────────────────────────────────────────
signal:
  enabled: ${SIGNAL_ENABLED:true}
  entry-threshold: 70          # 저점진입스코어 ≥
  min-base-score: 60           # 매력도 기본점수 ≥
  event-coefficient-min: 0.9   # 이벤트조정계수 ≥ (음수 이벤트 없음). 현재 조정계수는 항상 1.0
